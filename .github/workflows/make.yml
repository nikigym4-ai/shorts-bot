name: make-short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (khali chhodo = random)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests numpy pillow edge-tts
      - name: Make and send short
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TOPIC: ${{ github.event.inputs.topic }}
      - name: Keep copy
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: out.mp4
