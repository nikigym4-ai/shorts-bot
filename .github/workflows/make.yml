name: make-shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"   # roz subah 8:00 IST

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        category: [motivation, corporate, health]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests numpy pillow edge-tts
      - name: Make and send short
        run: python main.py
        env:
          CATEGORY: ${{ matrix.category }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Keep copy
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.category }}
          path: out.mp4
